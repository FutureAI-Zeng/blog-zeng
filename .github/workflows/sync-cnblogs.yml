name: Sync from cnblogs

# 两种触发方式：
# 1) 手动：GitHub 仓库 → Actions → "Sync from cnblogs" → Run workflow
# 2) 定时：默认每天 UTC 02:00（北京时间 10:00）；GitHub 对低频定时任务会加随机延迟
on:
  workflow_dispatch:
    inputs:
      update:
        description: '额外检查最新 N 篇文章是否更新（0=不检查）'
        required: false
        default: '0'
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install markdownify beautifulsoup4 lxml pyyaml

      - name: Run cnblogs sync
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.update }}" ] && [ "${{ github.event.inputs.update }}" != "0" ]; then
            ARGS="--update ${{ github.event.inputs.update }}"
          fi
          python scripts/sync_cnblogs.py $ARGS

      - name: Commit and push if changed
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: 从 cnblogs 同步新文章"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "已提交新文章"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "没有新内容需要同步"
          fi

      # GITHUB_TOKEN 的 push 不会触发 deploy.yml（on: push），
      # 故在推送后显式 workflow_dispatch 唤起重部署，使新文章自动上线。
      - name: Trigger deploy to GitHub Pages
        if: steps.sync.outputs.pushed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "已通过 workflow_dispatch 触发 Deploy to GitHub Pages"
